name: Feature request
description: An idea for a new function or a better measurement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Ideas are welcome. This is a personal tool, not a community project – whether and when a suggestion is taken up is decided by the maintainer.
  - type: textarea
    id: idea
    attributes:
      label: What would you like and why?
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Standard reference (if a measurement)
      description: e.g. EN 300 394-1 clause 7.1.3
